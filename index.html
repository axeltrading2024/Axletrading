<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EddySupply — Wholesale Product Finder</title>
  <meta name="description" content="Discover wholesale electronics, perfumes, watches and accessories from EddySupply — then order in one tap on WhatsApp.">
  <meta property="og:title" content="EddySupply — Wholesale Product Finder">
  <meta property="og:description" content="Discover wholesale electronics, perfumes, watches and accessories from EddySupply — then order in one tap on WhatsApp.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a1a'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' fill='white' text-anchor='middle'>E</text></svg>">
  <link rel="preload" as="image" href="assets/img/cat/perfumes.png">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

  <div data-header></div>

  <!-- ================= Hero ================= -->
  <section class="hero">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-a"></div>
    <div class="hero-glow-b"></div>

    <div class="hero-inner">
      <div class="hero-badge animate-in">
        <span class="dot"></span>
        <span data-hero-badge>EddySupply · Product Finder</span>
      </div>

      <h1 class="animate-in d1" data-hero-title></h1>

      <p class="hero-sub animate-in d2" data-hero-sub></p>

      <div class="search-shell animate-in d3" data-search-shell>
        <div class="search-box">
          <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
          <input type="search" data-search-input placeholder="Search product, brand, category…" aria-label="Search products" autocomplete="off">
          <a href="#browse" class="btn btn-dark btn-sm" style="flex-shrink:0">Browse</a>
        </div>
      </div>
    </div>

    <!-- 主推品 -->
    <div class="featured">
      <div class="featured-inner animate-in d4" data-featured></div>
    </div>
  </section>

  <!-- ================= Popular ================= -->
  <section id="popular" class="section wrap">
    <div class="section-head carousel-head">
      <div style="min-width:0">
        <p class="eyebrow-lg">Most asked</p>
        <h2 class="display">Popular products</h2>
        <p class="sub">The ones customers ask about the most on WhatsApp.</p>
      </div>
      <div class="carousel-nav">
        <button type="button" class="btn-icon" data-carousel-prev aria-label="Scroll left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button type="button" class="btn-icon" data-carousel-next aria-label="Scroll right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>
    </div>
    <div class="scroller" data-popular></div>
  </section>

  <!-- ================= Browse ================= -->
  <section id="browse" class="wrap" style="padding-bottom:96px">
    <div class="section-head">
      <p class="eyebrow-lg">Explore</p>
      <h2 class="display">Browse products</h2>
      <p class="sub">Everything Eddy supplies, organised so you find it in seconds.</p>
    </div>
    <div class="cat-grid" data-categories></div>
  </section>

  <footer class="site-footer">
    © <span data-year>2026</span> EddySupply. Chat with us on WhatsApp · +86 158 7520 9571
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    var y = document.querySelector('[data-year]');
    if (y) y.textContent = new Date().getFullYear();
  </script>
</body>
</html>
